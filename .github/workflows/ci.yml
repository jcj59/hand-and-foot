name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres, so the store's contract, the migrations and the restart
    # tests run against the database they are for rather than being skipped.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
      # What the deploy runs, short of uploading: the client build, and the Worker
      # bundled with it — which is where a Node-only import would first fail.
      - run: pnpm --filter @hf/client build
      - run: pnpm --filter @hf/worker exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
