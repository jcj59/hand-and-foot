name: Deploy

# The whole game — the page and every table — is one Cloudflare Worker, deployed
# once CI has passed on main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time, and never cancelled halfway.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # `branches: [main]` also matches a fork's PR from a branch named main, so the
    # run must be a push to this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare is set up
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so there is nothing to deploy to yet."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != ''
      # Builds the client into the Worker's assets, then deploys both together.
      - run: pnpm --filter @hf/worker run deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
